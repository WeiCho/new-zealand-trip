name: 天氣預報更新

on:
  # 日期還沒定，排程先關掉，只留手動執行。定了之後打開，月份改成出發前後；
  # 紐西蘭夏令時間 UTC+13：17:10 UTC = 06:10 NZDT、05:10 UTC = 18:10 NZDT。
  # 另外 scripts/update_forecast.py 的 JMA MSM 不涵蓋紐西蘭、時區寫死 KST，打開前要先改。
  # schedule:
  #   - cron: "10 5,17 * 1 *"
  workflow_dispatch:

# 與 deploy.yml 共用同一個 Pages 併發群組，避免兩邊同時部署
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Open-Meteo：16 天內的氣溫、降雨與逐時。抓不到只亮紅字、不中斷 job
      - name: 抓 Open-Meteo 預報並更新 trip.json
        continue-on-error: true
        run: python scripts/update_forecast.py trip.json

      - name: Commit & push
        id: commit
        run: |
          if git diff --quiet -- trip.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "trip.json 無變化，不 commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trip.json
          git commit -m "chore: 每日更新天氣預報"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # 以下只有真的有更新時才跑（用 GITHUB_TOKEN push 不會觸發 deploy.yml，所以這裡自己重建網站）
      - name: Install deps
        if: steps.commit.outputs.changed == 'true'
        run: pip install "jinja2>=3.1"

      - name: Render handbook from trip.json
        if: steps.commit.outputs.changed == 'true'
        run: python render.py .

      - name: Assemble site
        if: steps.commit.outputs.changed == 'true'
        run: |
          mkdir -p _site
          cp index.html sw.js manifest.webmanifest icon.svg "行程表.html" _site/
          # 跟 deploy.yml 一樣要帶圖，不然每次更新天氣，交通與彈窗圖片就全部 404
          if [ -d img ]; then cp -r img _site/; fi
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        if: steps.commit.outputs.changed == 'true'
        with:
          path: _site

      - id: deployment
        if: steps.commit.outputs.changed == 'true'
        uses: actions/deploy-pages@v4
